# Render Blueprint for the COPS API (FastAPI). New > Blueprint > pick this repo.
# The API keeps live state in memory (engine, SOS, machine health), so it needs one
# always-running server, which is why it runs here and not on Vercel.
services:
  - type: web
    name: cops-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/operators
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COPS_IDLE_ALERT_S
        value: "60"
      # Filled in on the Render dashboard (never committed):
      - key: COPS_SMS_TO
        sync: false
      - key: CALLMEBOT_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
